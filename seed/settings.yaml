{
  "agent-default-model": {
    "provider": "wuyu-orchestrator",
    "model": "deepseek-v4.1-flash",
    "reasoningEffort": "off"
  },
  "llm-pi-ai": {
    "providers": {
      "wuyu-orchestrator": {
        "api": "openai-completions",
        "apiKeyEnv": "WUYU_MODEL_GATEWAY_API_KEY",
        "baseURL": "http://127.0.0.1:18140/v1",
        "displayName": "无隅工作助手",
        "compat": {
          "thinkingFormat": "deepseek",
          "supportsReasoningEffort": false,
          "supportsDeveloperRole": false,
          "supportsStrictMode": false,
          "requiresReasoningContentOnAssistantMessages": true
        },
        "models": [
          {
            "id": "deepseek-v4.1-flash",
            "name": "无隅工作助手",
            "input": [
              "text"
            ],
            "contextWindow": 262144,
            "maxTokens": 16384,
            "reasoningEfforts": {
              "off": null,
              "high": "high"
            }
          }
        ]
      }
    }
  },
  "agent-presets": {
    "default": "wuyu-work"
  },
  "locale": {
    "preference": "zh"
  }
}
